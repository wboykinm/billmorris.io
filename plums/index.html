<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This Is Just to Say</title>
  <!-- Google Font: Crimson Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Minimalist reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Crimson Pro', Georgia, 'Times New Roman', serif;
      background-color: #f4ecd8; /* weathered book page tan */
      color: #111;
      padding: 1em;
    }
    .poem-container {
      max-width: 500px;
      text-align: left;
      line-height: 1.6;
      /* no padding here to keep on-screen minimal */
    }
    h1 {
      font-family: 'Crimson Pro', 'Palatino Linotype', 'Book Antiqua', serif;
      font-weight: 700;
      font-size: 2em;
      margin-bottom: 0.5em;
      text-align: center;
    }
    .author {
      font-style: italic;
      text-align: center;
      margin-bottom: 1.5em;
    }
    .stanza {
      margin-bottom: 1.5em;
    }
    #food {
      font-weight: bold;
    }
    footer {
      margin-top: auto;
      width: 100%;
      background-color: #e0d8c0;
      padding: 0.5em 0;
      text-align: center;
    }
    #download-btn {
      font-size: 0.8em;
      color: #333;
      background: none;
      border: none;
      cursor: pointer;
    }
    #download-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="poem-container" id="poem">
    <h1>This Is Just To Say</h1>
    <div class="author">By William Carlos Williams</div>
    <div class="stanza">
      I have eaten<br>
      the <span id="food">plums</span><br>
      that <span id="verb1">were</span> in<br>
      the icebox
    </div>
    <div class="stanza">
      and which<br>
      you were probably<br>
      saving<br>
      for breakfast
    </div>
    <div class="stanza">
      Forgive me<br>
      <span id="pronoun">they</span> <span id="verb2">were</span> delicious<br>
      so sweet<br>
      and so cold
    </div>
  </div>
  <footer>
    <button id="download-btn">🖼️</button>
  </footer>

  <!-- html2canvas for client-side image capture -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      function getParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }
      function isPlural(word) {
        const lower = word.trim().toLowerCase();
        return lower.endsWith('s') && !lower.endsWith('ss');
      }
      const raw = getParam('food');
      const foodEl = document.getElementById('food');
      if (raw !== null) {
        const limited = raw.substring(0, 300);
        const decoded = decodeURIComponent(limited.replace(/\+/g, ' '));
        foodEl.textContent = decoded;
        const plural = isPlural(decoded);
        document.getElementById('verb1').textContent = plural ? 'were' : 'was';
        document.getElementById('pronoun').textContent = plural ? 'they' : 'it';
        document.getElementById('verb2').textContent = plural ? 'were' : 'was';
      }

      // Download button handler
      document.getElementById('download-btn').addEventListener('click', function() {
        if (typeof html2canvas !== 'function') {
          alert('Preview generation is not available.');
          return;
        }
        const poemEl = document.getElementById('poem');
        // Temporarily add padding for capture
        const originalPadding = poemEl.style.padding;
        const originalBackground = poemEl.style.backgroundColor;
        poemEl.style.padding = '50px';
        poemEl.style.backgroundColor = '#f4ecd8';

        html2canvas(poemEl).then(canvas => {
          // restore original styles
          poemEl.style.padding = originalPadding;
          poemEl.style.backgroundColor = originalBackground;

          const link = document.createElement('a');
          const foodName = foodEl.textContent.replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'poem';
          link.download = `poem_${foodName}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      });
    });
  </script>
</body>
</html>
